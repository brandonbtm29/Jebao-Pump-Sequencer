[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jebao-pump-sequencer"
dynamic = ["version"]
description = "Desktop app to run manual doses, calibrations and multi-step sequences on Jebao MD-4.4 / Doser 2.4 dosing pumps through the Gizwits cloud."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brandon T. McReynolds" }]
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.5",
    "qasync>=0.27",
    "requests>=2.31",
]
keywords = ["jebao", "dosing pump", "gizwits", "pyqt6", "laboratory automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/brandonbtm29/Jebao-Pump-Sequencer"
Changelog = "https://github.com/brandonbtm29/Jebao-Pump-Sequencer/blob/main/CHANGELOG.md"
Issues = "https://github.com/brandonbtm29/Jebao-Pump-Sequencer/issues"

[project.gui-scripts]
jebao-pump = "jebao_gui:main"

[tool.hatch.version]
path = "jebao_gui.py"

[tool.hatch.build.targets.wheel]
only-include = ["jebao_gui.py", "settings_location.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
