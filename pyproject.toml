[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jebao-pump-sequencer"
dynamic = ["version"]
description = "Desktop app to run manual doses, calibrations and multi-step sequences on Jebao MD-4.4 / Doser 2.4 dosing pumps through the Gizwits cloud."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brandon T. McReynolds" }]
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.5",
    "qasync>=0.27",
    "requests>=2.31",
]
keywords = ["jebao", "dosing pump", "gizwits", "pyqt6", "laboratory automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/brandonbtm29/Jebao-Pump-Sequencer"
Changelog = "https://github.com/brandonbtm29/Jebao-Pump-Sequencer/blob/main/CHANGELOG.md"
Issues = "https://github.com/brandonbtm29/Jebao-Pump-Sequencer/issues"

[project.gui-scripts]
jebao-pump = "jebao_gui:main"

[tool.hatch.version]
path = "jebao_gui.py"

[tool.hatch.build.targets.wheel]
only-include = ["jebao_gui.py", "settings_location.py", "updater.py", "shortcut.py", "assets"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
# settings_location.py is shared verbatim by all UAkron lab apps; keep it byte-identical.
extend-exclude = ["settings_location.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101: asserts are fine in tests. E501: the formatter handles line length; long strings stay.
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
# The app chdirs into its data folder before importing the rest, on purpose.
"jebao_gui.py" = ["E402"]
